<!doctype html>
<html lang="ru">
<meta charset="utf-8">
<div id="app"></div>
<script type="module">
import { createApp, h, ref } from "vue";
import "bootstrap/dist/css/bootstrap.min.css";
import ScrollableSelect from "../src/components/ScrollableSelect.vue";

createApp({
  components: { ScrollableSelect },
  setup() {
    const selected = ref("");
    const options = ref([]);
    window.filled = false;
    const refresh = () => {
      options.value = Array.from({ length: 35 }, (_, index) => ({
        value: String(index + 1), label: `Задание ${index + 1}`,
        disabled: index === 0 && !window.filled,
      }));
    };
    refresh();
    return () => h("main", { style: "padding: 30px; width: 540px; max-width: 100%" }, [
      h(ScrollableSelect, {
        modelValue: selected.value, options: options.value, label: "Тест", placeholder: "Выберите тест",
        "onUpdate:modelValue": value => selected.value = value, onOpen: refresh,
      }),
      h("output", { id: "selected" }, selected.value),
      h("button", { id: "outside", style: "margin-top: 300px" }, "Outside"),
    ]);
  },
}).mount("#app");
</script>
</html>
